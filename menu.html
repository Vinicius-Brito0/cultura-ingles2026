<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="menu.css">
    <title>Cultura Inglesa</title>
</head>
<body>

    <!-- Cabeçalho -->
    <header class="navbar navbar-light bg-white shadow-sm px-4 position-relative">
        <div class="container-fluid d-flex align-items-center justify-content-between">

            <!-- Botão para abrir o menu -->
            <button
                class="btn border-0 d-flex align-items-center p-0"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#menuNavegacao"
                aria-controls="menuNavegacao"
                aria-label="Abrir menu de navegação">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
                <span class="ms-2 fw-bold text-dark">MENU</span>
            </button>

            <!-- Logo Centralizada -->
            <a class="navbar-brand navbar-brand-centered m-0" href="/" aria-label="Página inicial da Cultura Inglesa">
                <img src="Logo (1).png" alt="Cultura Inglesa" height="40">
            </a>

            <!-- Botão do Portal do Aluno -->
            <a href="/portal" class="btn btn-outline-primary rounded-pill px-4 d-none d-md-inline-block">
                Portal do Aluno
            </a>

        </div>
    </header>

    <!-- Menu Lateral (Offcanvas) -->
    <aside
        class="offcanvas offcanvas-start custom-offcanvas text-white"
        tabindex="-1"
        id="menuNavegacao"
        aria-labelledby="tituloMenuNavegacao">
        <!-- Cabeçalho do menu lateral -->
        <header class="offcanvas-header pb-3">
            <button 
                type="button"
                class="btn-close btn-close-white text-reset m-0"
                data-bs-dismiss="offcanvas"
                aria-label="Fechar menu de navegação">
            </button>
            <span id="tituloMenuNavegacao" class="fw-semibold text-uppercase">FECHAR</span>
        </header>

        <!-- Conteúdo do menu -->
        <div class="offcanvas-body d-flex flex-column justify-content-between">
            <nav aria-label="Navegação Principal">
                <ul class="nav flex-column">
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white px-0" href="#">Início</a>
                    </li>
                    
                    <!-- Submenu dos Cursos (Com classe btn-cursos para controlar o vermelho ao abrir) -->
                    <li class="nav-item mb-2">
                        <button
                            class="btn btn-link btn-cursos text-white text-decoration-none px-0 w-100 d-flex justify-content-between align-items-center"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#submenuCursos"
                            aria-expanded="false"
                            aria-controls="submenuCursos">
                            <span>Cursos</span>
                            <i class="bi bi-chevron-down" aria-hidden="true"></i>
                        </button>

                        <div class="collapse ps-3 mt-2" id="submenuCursos">
                            <ul class="nav flex-column gap-1">
                                <li class="nav-item"><a class="nav-link text-white py-1 px-0" href="/cursos/kids">Kids</a></li>
                                <li class="nav-item"><a class="nav-link text-white py-1 px-0" href="/cursos/teens">Teens</a></li>
                                <li class="nav-item"><a class="nav-link text-white py-1 px-0" href="/cursos/jovens-adultos">Jovens e Adultos</a></li>
                                <li class="nav-item"><a class="nav-link text-white py-1 px-0" href="/cursos/exames">Exames Internacionais</a></li>
                                <li class="nav-item"><a class="nav-link text-white py-1 px-0" href="/cursos/empresas">Empresas</a></li>
                            </ul>
                        </div>
                    </li>
                    
                    <li class="nav-item mb-2"><a class="nav-link text-white px-0" href="/exames">Exames Internacionais</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-white px-0" href="/stations">Stations</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-white px-0" href="/institucional">Institucional</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-white px-0" href="/unidades">Unidades</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-white px-0" href="/blog">Blog</a></li>
                </ul>
            </nav>

            <!-- Rodapé do menu lateral -->
            <footer class="mt-4 pt-3 border-top border-secondary">
                <ul class="list-unstyled d-flex flex-column gap-2 mb-0">
                    <li>
                        <a href="/portal" class="btn btn-outline-light w-100 rounded-pill d-flex justify-content-between align-items-center px-3 py-2">
                            <span>Portal do aluno</span>
                            <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li>
                        <a href="/matricula" class="btn btn-danger w-100 rounded-pill d-flex justify-content-between align-items-center px-3 py-2">
                            <span>Matricule-se</span>
                            <i class="bi bi-file-earmark-text" aria-hidden="true"></i>
                        </a>
                    </li>
                </ul>
            </footer>

        </div>
    </aside>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
